name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build Nexus
        run: pnpm --filter @workspace/nexus run build
        env:
          VITE_API_BASE_URL: "https://olchaai-api-production.up.railway.app"
          VITE_WS_URL: "wss://olchaai-go-production.up.railway.app/go/ws"

      - name: Trigger Railway redeploy via API
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-raw '{
              "query": "mutation { serviceInstanceRedeploy(environmentId: \"3f9b1d72-2c6d-49db-b756-42ac52ba7aa0\", serviceId: \"6a712054-7af1-4910-a96e-9e0696490b44\") }"
            }')
          echo "Railway API response: $RESPONSE"
          # Don't fail the workflow if Railway API is unavailable
          exit 0
